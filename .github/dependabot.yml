version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      prisma:
        patterns: [prisma, '@prisma/client']
      prisma-security:
        applies-to: security-updates
        patterns: [prisma, '@prisma/client']
      vitest:
        patterns: [vitest, '@vitest/*']
      vitest-security:
        applies-to: security-updates
        patterns: [vitest, '@vitest/*']
    # Major upgrades require a coordinated application and migration review.
    ignore:
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: tailwind-merge
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # Node types and test-runtime requirements are reviewed with the Node baseline.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, github_actions]
    groups:
      codeql:
        patterns: ['github/codeql-action/*']

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    # Keep Node on the reviewed runtime major while accepting image updates.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
